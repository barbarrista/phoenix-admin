{% macro macro(view) -%}
<li class="nav-item">
  <a class="nav-link" href="{{ url_for(__admin_route_name__~ ':list', identity=view.identity) }}">
    <span class="nav-link-icon d-md-none d-lg-inline-block">
      {% if view.config.icon %}
      <i class="{{ view.config.icon }}"></i>
      {% endif %}
    </span>
    <span class="nav-link-title"> {{ view.config.title or "No name" }} </span>
  </a>
</li>
{% endmacro %}
